<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學錯題偵探研究所 _整數分數四則運算</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- MathJax 數學公式渲染 -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            background-color: #FFFDF9;
            color: #2D3748;
            font-family: 'Noto Sans TC', sans-serif;
            background-image: radial-gradient(#FFB26B 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }
        .anime-box {
            background: #FFFFFF;
            border: 3px solid #2D3748;
            box-shadow: 4px 4px 0px #2D3748;
            border-radius: 16px;
        }
        .anime-btn {
            border: 3px solid #2D3748;
            box-shadow: 3px 3px 0px #2D3748;
            font-weight: 700;
            transition: all 0.1s ease;
        }
        .anime-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #2D3748;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b-4 border-slate-800 py-3 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🔍</span>
                <h1 class="text-xl font-black text-orange-600">數學錯題偵探研究所</h1>
            </div>
            <div>
                <span class="px-3 py-1 bg-amber-100 text-amber-900 text-xs font-bold rounded-full border-2 border-slate-800">✨ 四學公開觀課</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto p-4 md:p-6 my-auto">

        <!-- 學生端 / 主畫面 -->
        <div id="view-student" class="space-y-6">
            <div id="screen-login" class="anime-box p-8 text-center space-y-6">
                <div class="space-y-2">
                    <span class="inline-block px-3 py-1 bg-amber-100 text-amber-900 text-xs font-bold rounded-full border-2 border-slate-800">✨ 國一數學雙生智庫・四學公開觀課</span>
                    <h2 class="text-2xl font-black text-slate-800">挑戰你的數學火眼金睛！</h2>
                    <p class="text-slate-600 text-sm">從 30 道大題庫中隨機抽選 10 題迷思題，找出藏在計算過程中的破綻！</p>
                </div>

                <div class="max-w-xs mx-auto space-y-4 text-left">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">班級 (例如: 701)</label>
                        <input type="text" id="input-class" placeholder="請輸入班級" class="w-full px-4 py-2 border-2 border-slate-800 rounded-xl font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">座號 (例如: 15)</label>
                        <input type="text" id="input-seat" placeholder="請輸入座號" class="w-full px-4 py-2 border-2 border-slate-800 rounded-xl font-bold">
                    </div>
                    <button onclick="startQuiz()" class="w-full py-3 bg-orange-500 text-white rounded-xl anime-btn text-lg">
                        🚀 開始偵探任務
                    </button>
                </div>

                <div class="pt-4 border-t-2 border-dashed border-slate-300 flex flex-col items-center justify-center space-y-2">
                    <p class="text-xs font-bold text-slate-500">📷 學生掃描此 QR Code 即可秒進遊戲：</p>
                    <div id="qrcode" class="p-3 bg-white border-3 border-slate-800 rounded-xl"></div>
                </div>
            </div>

            <!-- 答題主畫面 -->
            <div id="screen-quiz" class="hidden anime-box p-6 md:p-8 space-y-6">
                <div class="flex justify-between items-center pb-4 border-b-2 border-slate-200 text-sm font-bold">
                    <span id="quiz-progress" class="text-orange-600 text-base">第 1 題 / 共 10 題</span>
                    <span id="quiz-student-badge" class="px-3 py-1 bg-amber-100 border-2 border-slate-800 rounded-xl text-slate-800"></span>
                </div>

                <div class="space-y-4">
                    <div class="p-4 bg-orange-50 rounded-xl border-2 border-slate-800">
                        <span class="text-xs font-black text-orange-700">🎯 任務目標：找出下列計算的錯誤之處</span>
                        <div id="question-text" class="text-lg font-bold mt-2 text-slate-900"></div>
                    </div>

                    <div class="p-4 bg-rose-50 rounded-xl border-2 border-slate-800">
                        <span class="text-xs font-black text-rose-700">❌ 學生錯誤計算過程</span>
                        <div id="wrong-process" class="mt-2 text-slate-800 whitespace-pre-line font-mono text-sm"></div>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-sm font-bold text-slate-800">💬 請問錯誤發生在哪一個步驟？</label>
                    <div id="options-container" class="space-y-2"></div>
                </div>

                <div id="feedback-box" class="hidden p-4 rounded-xl text-sm border-2 border-slate-800"></div>

                <div class="flex justify-end pt-4 border-t-2 border-slate-200">
                    <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-slate-800 text-white rounded-xl anime-btn">
                        下一題 ➔
                    </button>
                </div>
            </div>

            <!-- 結算畫面 -->
            <div id="screen-result" class="hidden anime-box p-8 text-center space-y-6">
                <div class="space-y-2">
                    <span class="text-5xl">🏆</span>
                    <h2 class="text-2xl font-black text-slate-800">偵探任務圓滿達成！</h2>
                    <p class="text-slate-600 font-bold">你的解謎總得分：</p>
                    <div id="final-score" class="text-5xl font-black text-orange-600">0</div>
                </div>
                <div id="result-summary" class="text-sm text-slate-700 bg-amber-50 p-4 rounded-xl border-2 border-slate-800 text-left"></div>
                <button onclick="location.reload()" class="px-6 py-3 bg-orange-500 text-white rounded-xl anime-btn">
                    🔄 再次挑戰
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs font-bold text-slate-500 border-t-4 border-slate-800 bg-white mt-12">
        Shasa LaLa x 雙生智庫 公開觀課專用系統 &copy; 2026
    </footer>

    <!-- Script -->
    <script>
        // 30 題完整題庫
        const QUESTION_BANK = [
            { id: 1, topic: "負號去括號變號錯誤", question: "$15 - [3 - 2 \\times (5 - 8)]$", wrong_process: "1. 先算括號：$5 - 8 = -3$\n2. 乘法：$2 \\times (-3) = -6$\n3. 去括號：$15 - [3 - (-6)] = 15 - 3 - 6 = 6$", wrong_step: "第 3 步（去括號未變號）", options: ["第 1 步", "第 2 步", "第 3 步 (去括號未變號)", "完全正確"], correct: 2, explanation: "減去負數等於加上正數，應為 $3 + 6 = 9$。" },
            { id: 2, topic: "運算順序由左至右錯誤", question: "$24 \\div 4 \\times 2 + 3 \\times (5 - 2)$", wrong_process: "1. 算括號：$5 - 2 = 3$\n2. 後方乘法：$2 \\times 3 = 6$\n3. 前方除法：$24 \\div 4 = 6$\n4. 相乘：$6 \\times 6 = 36$", wrong_step: "未由左至右計算", options: ["第 1 步", "第 2、3 步 (未由左至右)", "第 4 步", "完全正確"], correct: 1, explanation: "乘除法同級，必須由左至右計算。" },
            { id: 3, topic: "分配律負號漏乘", question: "$-3 \\times [12 + (-4) - 7]$", wrong_process: "1. 展開：$(-3) \\times 12 + (-3) \\times (-4) - 7$\n2. 計算：$-36 + 12 - 7 = -31$", wrong_step: "分配律漏乘最後一項", options: ["第 1 步 (漏乘最後一項)", "第 2 步", "正負號錯誤", "完全正確"], correct: 0, explanation: "外面的 $-3$ 必須乘以括號內每一項。" },
            { id: 4, topic: "帶分數未化假分數", question: "$2\\frac{1}{3} \\times 1\\frac{1}{4}$", wrong_process: "1. 整數乘整數：$2 \\times 1 = 2$\n2. 分數乘分數：$\\frac{1}{12}$\n3. 組合：$2\\frac{1}{12}$", wrong_step: "帶分數未化假分數", options: ["第 1 步", "第 1、2 步 (未化假分數)", "第 3 步", "完全正確"], correct: 1, explanation: "帶分數相乘必須先化為假分數再計算。" },
            { id: 5, topic: "異分母加法分母相加", question: "$1 \\div \\left(\\frac{1}{2} + \\frac{1}{3}\\right)$", wrong_process: "1. 括號內相加：$\\frac{1+1}{2+3} = \\frac{2}{5}$\n2. 除法：$\\frac{5}{2}$", wrong_step: "分母直接相加", options: ["第 1 步 (分母直接相加)", "第 2 步", "運算順序錯誤", "完全正確"], correct: 0, explanation: "分數相加減必須先通分才能相加。" },
            { id: 6, topic: "分子含有加法時錯誤約分", question: "$\\frac{3 + 6}{3}$", wrong_process: "1. 約分：分子分母的 3 互相約掉 $\\rightarrow \\frac{1 + 6}{1} = 7$", wrong_step: "單獨約分加法項", options: ["第 1 步 (不能單獨約分加法項)", "加法錯誤", "完全正確"], correct: 0, explanation: "分子的 $3 + 6$ 是一個整體，應先算分子再除以分母。" },
            { id: 7, topic: "通分後分子未同步擴分", question: "$\\frac{3}{4} - \\frac{1}{6}$", wrong_process: "1. 分母變 12，分子照抄：$\\frac{3}{12} - \\frac{1}{12}$", wrong_step: "分子未同步擴分", options: ["公因數找錯", "分子未同步擴分", "完全正確"], correct: 1, explanation: "分母乘幾，分子也要跟著乘相對倍數。" },
            { id: 8, topic: "混合運算顛倒先後順序", question: "$2 - \\frac{3}{4} \\div \\frac{9}{8}$", wrong_process: "1. 先算減法 $2 - \\frac{3}{4} = \\frac{5}{4}$", wrong_step: "先做了減法", options: ["應先算除法", "倒數錯誤", "完全正確"], correct: 0, explanation: "乘除法優先於加減法，應先算除法。" },
            { id: 9, topic: "除法對乘法做錯誤分配", question: "$5 \\div \\left(\\frac{1}{2} \\times \\frac{1}{3}\\right)$", wrong_process: "1. 錯誤分配：$5 \\div \\frac{1}{2} + 5 \\div \\frac{1}{3}$", wrong_step: "除法對乘法做錯誤分配", options: ["錯誤分配乘法括號", "計算錯誤", "完全正確"], correct: 0, explanation: "括號內是乘法時不能分配，應先算括號內。" },
            { id: 10, topic: "負數奇數次方與絕對值混淆", question: "$(-2)^3 - \\left| -\\frac{3}{4} \\right|$", wrong_process: "1. $(-2)^3 = 8$", wrong_step: "負數奇數次方正負號錯誤", options: ["負數奇數次方正負號錯誤", "絕對值錯誤", "完全正確"], correct: 0, explanation: "(-2)的三次方應為 -8。" },
            { id: 11, topic: "正負數加減法符號迷思", question: "$-5 - (-8)$", wrong_process: "$-5 - 8 = -13$", wrong_step: "去括號變號錯誤", options: ["減負數等於加正數", "減法變號錯誤", "完全正確"], correct: 0, explanation: "$-5 - (-8) = -5 + 8 = 3$。" },
            { id: 12, topic: "乘法分配律符號遺漏", question: "$-2(x - 5)$", wrong_process: "$-2x - 10$", wrong_step: "第二項變號錯誤", options: ["漏掉負負得正", "係數相乘錯誤", "完全正確"], correct: 0, explanation: "$-2 \\times (-5) = +10$。" },
            { id: 13, topic: "分數除法未將除數倒數", question: "$\\frac{2}{3} \\div \\frac{4}{5}$", wrong_process: "$\\frac{2}{3} \\times \\frac{4}{5} = \\frac{8}{15}$", wrong_step: "未將除數倒數", options: ["未將除數倒數", "分子相乘錯誤", "完全正確"], correct: 0, explanation: "除以一個數等於乘以其倒數。" },
            { id: 14, topic: "分數平方範圍錯誤", question: "$(-\\frac{2}{3})^2$", wrong_process: "$-\\frac{4}{9}$", wrong_step: "負號未一同平方", options: ["負號未一同平方", "分子平方錯誤", "完全正確"], correct: 0, explanation: "負號受平方影響，結果為正。" },
            { id: 15, topic: "絕對值內含負號處理", question: "$-\\left| -7 \\right|$", wrong_process: "$7$", wrong_step: "漏掉外側負號", options: ["漏掉外側負號", "絕對值計算錯誤", "完全正確"], correct: 0, explanation: "絕對值內為7，但前方帶有負號。" },
            { id: 16, topic: "分數加減通分倍數錯誤", question: "$\\frac{1}{3} + \\frac{1}{4}$", wrong_process: "$\\frac{4}{7} + \\frac{3}{7}$", wrong_step: "分母相加而非找公倍數", options: ["分母相加錯誤", "通分倍數錯誤", "完全正確"], correct: 0, explanation: "應找最小公倍數 12。" },
            { id: 17, topic: "連續除法順序錯誤", question: "$12 \\div 3 \\div 2$", wrong_process: "$12 \\div (3 \\div 2) = 8$", wrong_step: "未由左至右計算", options: ["未由左至右計算", "除法錯誤", "完全正確"], correct: 0, explanation: "連續除法應由左至右依序計算。" },
            { id: 18, topic: "整數與分數相加通分錯誤", question: "$2 + \\frac{1}{3}$", wrong_process: "$\\frac{2}{3}$", wrong_step: "整數未化為同分母", options: ["整數未化為同分母", "加法錯誤", "完全正確"], correct: 0, explanation: "2 應化為 $\\frac{6}{3}$。" },
            { id: 19, topic: "括號前負號去括號漏變號", question: "$10 - (2 + 3 - 4)$", wrong_process: "$10 - 2 + 3 - 4$", wrong_step: "括號內未全面變號", options: ["僅第一項變號", "計算錯誤", "完全正確"], correct: 0, explanation: "括號前是負號，展開應每項變號。" },
            { id: 20, topic: "分數繁分式化簡錯誤", question: "$\\frac{\\frac{1}{2}}{\\frac{1}{4}}$", wrong_process: "$\\frac{1}{8}$", wrong_step: "上下直接相乘錯誤", options: ["上下直接相乘錯誤", "倒數除法錯誤", "完全正確"], correct: 0, explanation: "分子除以分母等於乘以倒數。" },
            { id: 21, topic: "負數加法絕對值方向錯誤", question: "$(-12) + 7$", wrong_process: "$+19$", wrong_step: "異號相加誤算成相加", options: ["異號相加應相減", "加法錯誤", "完全正確"], correct: 0, explanation: "應相減取絕對值較大者符號。" },
            { id: 22, topic: "指數律乘法底數相加錯誤", question: "$2^3 \\times 2^2$", wrong_process: "$2^6$", wrong_step: "指數相乘錯誤", options: ["指數相乘錯誤", "底數相乘錯誤", "完全正確"], correct: 0, explanation: "同底數相乘，指數相加得 $2^5$。" },
            { id: 23, topic: "分數約分遺漏公因數", question: "$\\frac{24}{36}$", wrong_process: "$\\frac{6}{9}$", wrong_step: "未約到最簡分數", options: ["未約到最簡分數", "公因數找錯", "完全正確"], correct: 0, explanation: "最大公因數為 12，應化簡為 $\\frac{2}{3}$。" },
            { id: 24, topic: "乘法對加法分配律漏乘第一項", question: "$4 \\times (5 + 3)$", wrong_process: "$5 + 4 \\times 3$", wrong_step: "漏乘第一項", options: ["漏乘第一項", "計算錯誤", "完全正確"], correct: 0, explanation: "4 必須乘以括號內每一項。" },
            { id: 25, topic: "相反數觀念混淆", question: "$-(-(-5))$", wrong_process: "$-5$", wrong_step: "負號累計次數錯誤", options: ["負號累計次數錯誤", "絕對值錯誤", "完全正確"], correct: 0, explanation: "三個負號相乘結果為負。" },
            { id: 26, topic: "分數乘法整數與分母亂約", question: "$5 \\times \\frac{3}{5}$", wrong_process: "$\\frac{25}{3}$", wrong_step: "整數誤乘入分母", options: ["整數乘分母錯誤", "約分錯誤", "完全正確"], correct: 0, explanation: "整數應與分子相乘。" },
            { id: 27, topic: "中括號與小括號順序顛倒", question: "$[20 \\div (5 - 3)] \\times 2$", wrong_process: "$20 \\div [5 - (3 \\times 2)]$", wrong_step: "擅自更改運算次序", options: ["更改運算次序", "括號計算錯誤", "完全正確"], correct: 0, explanation: "應由內而外計算。" },
            { id: 28, topic: "分數減法借位觀念錯誤", question: "$3 - 1\\frac{1}{4}$", wrong_process: "$2\\frac{1}{4}$", wrong_step: "未借位", options: ["未借位", "減法錯誤", "完全正確"], correct: 0, explanation: "3 應借位為 $2\\frac{4}{4}$。" },
            { id: 29, topic: "乘除混合加括號錯誤", question: "$8 \\div 4 \\times \\frac{1}{2}$", wrong_process: "$8 \\div (4 \\times \\frac{1}{2}) = 4$", wrong_step: "擅自加括號改變順序", options: ["擅自加括號改變順序", "計算錯誤", "完全正確"], correct: 0, explanation: "乘除法應由左至右計算。" },
            { id: 30, topic: "負數次方與括號位置陷阱", question: "$-3^2$ 與 $(-3)^2$", wrong_process: "皆為 9", wrong_step: "忽略負號是否受平方影響", options: ["忽略負號受平方影響", "指數錯誤", "完全正確"], correct: 0, explanation: "$-3^2 = -9$，而 $(-3)^2 = 9$。" }
        ];

        let currentQuizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let studentAnswers = [];
        let studentInfo = { class: "", seat: "" };

        // 請在此處貼上您的 Google Apps Script 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxJkCcgLpIBU7CEVDoqcFN9l1c1gyCRZFYjcBG4jYAHzUqQmYoiIpYbc073-3u7ybe8FA/exec"; 

        window.onload = function() {
            const currentUrl = window.location.href.split('#')[0];
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl, width: 120, height: 120
            });
        };

        function startQuiz() {
            const cls = document.getElementById('input-class').value.trim();
            const seat = document.getElementById('input-seat').value.trim();
            if (!cls || !seat) { alert("請填寫班級與座號！"); return; }
            studentInfo.class = cls; studentInfo.seat = seat;

            currentQuizQuestions = [...QUESTION_BANK].sort(() => Math.random() - 0.5).slice(0, 10);
            currentQuestionIndex = 0; score = 0; studentAnswers = [];

            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            document.getElementById('quiz-student-badge').innerText = `${cls}班 ${seat}號`;
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuizQuestions[currentQuestionIndex];
            document.getElementById('quiz-progress').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${currentQuizQuestions.length} 題`;
            document.getElementById('question-text').innerHTML = q.question;
            document.getElementById('wrong-process').innerHTML = q.wrong_process;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                optsContainer.innerHTML += `
                    <button onclick="selectOption(${idx})" class="w-full text-left px-4 py-3 border-2 border-slate-800 rounded-xl hover:bg-orange-100 font-bold text-slate-800 option-btn bg-white">
                        ${String.fromCharCode(65 + idx)}. ${opt}
                    </button>
                `;
            });

            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();
        }

        function selectOption(selectedIdx) {
            const q = currentQuizQuestions[currentQuestionIndex];
            const optionBtns = document.querySelectorAll('.option-btn');
            
            optionBtns.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) btn.classList.add('bg-emerald-100', 'border-emerald-600');
                else if (idx === selectedIdx) btn.classList.add('bg-rose-100', 'border-rose-600');
            });

            const isCorrect = (selectedIdx === q.correct);
            if (isCorrect) score += 10;

            studentAnswers.push({ questionId: q.id, topic: q.topic, isCorrect: isCorrect });

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');
            if (isCorrect) {
                feedbackBox.className = "p-4 rounded-xl text-sm border-2 border-slate-800 bg-emerald-50 text-emerald-900 font-bold";
                feedbackBox.innerHTML = `<strong>✅ 答對了！</strong><br>${q.explanation}`;
            } else {
                feedbackBox.className = "p-4 rounded-xl text-sm border-2 border-slate-800 bg-rose-50 text-rose-900 font-bold";
                feedbackBox.innerHTML = `<strong>❌ 答錯囉！</strong>迷思：${q.wrong_step}<br>解析：${q.explanation}`;
            }

            document.getElementById('next-btn').classList.remove('hidden');
            if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizQuestions.length) renderQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} 分`;

            const wrongItems = studentAnswers.filter(a => !a.isCorrect);
            let summaryHtml = `<h4 class="font-black mb-2">📋 健檢報告：</h4>`;
            if (wrongItems.length === 0) summaryHtml += `<p class="text-emerald-700 font-bold">全數答對！完美通關！</p>`;
            else {
                summaryHtml += `<ul class="list-disc pl-5 text-rose-800 font-semibold">`;
                wrongItems.forEach(w => summaryHtml += `<li>題號 ${w.questionId}：${w.topic}</li>`);
                summaryHtml += `</ul>`;
            }
            document.getElementById('result-summary').innerHTML = summaryHtml;

            // 準備傳送到 Google 試算表的資料 (僅傳送班級與座號)
            const payload = {
                class: studentInfo.class,
                seat: studentInfo.seat,
                score: score,
                wrongTopics: wrongItems.map(w => `題${w.questionId}:${w.topic}`).join(', ') || "全對",
                timestamp: new Date().toLocaleString()
            };

            // 傳送至 Google Sheets 後端
            if (GAS_URL && GAS_URL.startsWith("http")) {
                fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.log("雲端同步錯誤:", err));
            }
        }
    </script>
</body>
