<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學四則運算錯題偵探研究所</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- MathJax 數學公式渲染 -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            background-color: #FFFDF9;
            color: #2D3748;
            font-family: 'Noto Sans TC', sans-serif;
            background-image: radial-gradient(#FFB26B 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }
        .anime-box {
            background: #FFFFFF;
            border: 3px solid #2D3748;
            box-shadow: 4px 4px 0px #2D3748;
            border-radius: 16px;
        }
        .anime-btn {
            border: 3px solid #2D3748;
            box-shadow: 3px 3px 0px #2D3748;
            font-weight: 700;
            transition: all 0.1s ease;
        }
        .anime-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #2D3748;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b-4 border-slate-800 py-3 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🔍</span>
                <h1 class="text-xl font-black text-orange-600">數學四則運算錯題偵探研究所</h1>
            </div>
            <div>
                <span class="px-3 py-1 bg-amber-100 text-amber-900 text-xs font-bold rounded-full border-2 border-slate-800">✨ 公開觀課</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto p-4 md:p-6 my-auto">

        <!-- 學生端 / 主畫面 -->
        <div id="view-student" class="space-y-6">
            <div id="screen-login" class="anime-box p-8 text-center space-y-6">
                <div class="space-y-2">
                    <span class="inline-block px-3 py-1 bg-amber-100 text-amber-900 text-xs font-bold rounded-full border-2 border-slate-800">✨ 國一數學四則運算錯題偵測_四學公開觀課</span>
                    <h2 class="text-2xl font-black text-slate-800">挑戰你的數學火眼金睛！</h2>
                    <p class="text-slate-600 text-sm">從 30 道純整數與分數大題庫中隨機抽選 10 題迷思題，找出藏在計算過程中的破綻！</p>
                </div>

                <div class="max-w-xs mx-auto space-y-4 text-left">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">班級 (例如: 701)</label>
                        <input type="text" id="input-class" placeholder="請輸入班級" class="w-full px-4 py-2 border-2 border-slate-800 rounded-xl font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">座號 (例如: 15)</label>
                        <input type="text" id="input-seat" placeholder="請輸入座號" class="w-full px-4 py-2 border-2 border-slate-800 rounded-xl font-bold">
                    </div>
                    <button onclick="startQuiz()" class="w-full py-3 bg-orange-500 text-white rounded-xl anime-btn text-lg">
                        🚀 開始偵探任務
                    </button>
                </div>

                <div class="pt-4 border-t-2 border-dashed border-slate-300 flex flex-col items-center justify-center space-y-2">
                    <p class="text-xs font-bold text-slate-500">📷 學生掃描此 QR Code 即可秒進遊戲：</p>
                    <div id="qrcode" class="p-3 bg-white border-3 border-slate-800 rounded-xl"></div>
                </div>
            </div>

            <!-- 答題主畫面 -->
            <div id="screen-quiz" class="hidden anime-box p-6 md:p-8 space-y-6">
                <div class="flex justify-between items-center pb-4 border-b-2 border-slate-200 text-sm font-bold">
                    <span id="quiz-progress" class="text-orange-600 text-base">第 1 題 / 共 10 題</span>
                    <span id="quiz-student-badge" class="px-3 py-1 bg-amber-100 border-2 border-slate-800 rounded-xl text-slate-800"></span>
                </div>

                <div class="space-y-4">
                    <div class="p-4 bg-orange-50 rounded-xl border-2 border-slate-800">
                        <span class="text-xs font-black text-orange-1000">🎯 任務目標：找出下列計算的錯誤之處</span>
                        <div id="question-text" class="text-lg font-bold mt-2 text-slate-1000"></div>
                    </div>

                    <div class="p-4 bg-rose-50 rounded-xl border-2 border-slate-800">
                        <span class="text-xs font-black text-rose-1000">❌ 學生錯誤計算過程</span>
                        <div id="wrong-process" class="mt-2 text-slate-1000 whitespace-pre-line font-mono text-sm"></div>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-sm font-bold text-slate-1000">💬 請問錯誤發生在哪一個步驟？</label>
                    <div id="options-container" class="space-y-2"></div>
                </div>

                <div id="feedback-box" class="hidden p-4 rounded-xl text-sm border-2 border-slate-800"></div>

                <div class="flex justify-end pt-4 border-t-2 border-slate-200">
                    <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-slate-800 text-white rounded-xl anime-btn">
                        下一題 ➔
                    </button>
                </div>
            </div>

            <!-- 結算畫面 -->
            <div id="screen-result" class="hidden anime-box p-8 text-center space-y-6">
                <div class="space-y-2">
                    <span class="text-5xl">🏆</span>
                    <h2 class="text-2xl font-black text-slate-800">偵探任務圓滿達成！</h2>
                    <p class="text-slate-600 font-bold">你的解謎總得分：</p>
                    <div id="final-score" class="text-5xl font-black text-orange-600">0</div>
                </div>
                <div id="result-summary" class="text-sm text-slate-700 bg-amber-50 p-4 rounded-xl border-2 border-slate-800 text-left"></div>
                <button onclick="location.reload()" class="px-6 py-3 bg-orange-500 text-white rounded-xl anime-btn">
                    🔄 再次挑戰
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs font-bold text-slate-500 border-t-4 border-slate-800 bg-white mt-12">
        Shasa LaLa x 四則運算錯題公開觀課專用系統 &copy; 2026
    </footer>

    <!-- Script -->
  <script>
        // 50 題完全查修確認之純數字經典迷思題庫
        const QUESTION_BANK = [
            { id: 1, topic: "負號去括號變號錯誤", question: "$15 - [3 - 2 \\times (1 - 4)]$", wrong_process: "1. 先算括號：$1 - 4 = -3$\n2. 乘法：$2 \\times (-3) = -6$\n3. 去括號：$15 - [3 - (-6)] = 15 - 3 - 6 = 6$", wrong_step: "第 3 步（去括號未變號）", options: ["第 1 步", "第 2 步", "第 3 步 (去括號未變號)", "完全正確"], correct: 2, explanation: "減去負數應變號為加上正數，正確應為 $15 - 3 + 6 = 18$，學生第 3 步去括號未變號且結果邏輯有誤。" },
            { id: 2, topic: "運算順序由左至右錯誤", question: "$24 \\div 4 \\times 2 + 3 \\times (5 - 2)$", wrong_process: "1. 算括號：$5 - 2 = 3$\n2. 後方乘法：$2 \\times 3 = 6$\n3. 前方除法：$24 \\div 4 = 6$\n4. 相乘：$6 \\times 6 = 36$", wrong_step: "未由左至右計算", options: ["第 1 步", "第 2、3 步 (未由左至右)", "第 4 步", "完全正確"], correct: 1, explanation: "乘除法同級，必須由左至右計算，不應先算後方的乘法。" },
            { id: 3, topic: "分配律負號漏乘", question: "$-3 \\times [12 + (-4) - 7]$", wrong_process: "1. 展開：$(-3) \\times 12 + (-3) \\times (-4) - 7$\n2. 計算：$-36 + 12 - 7 = -31$", wrong_step: "分配律漏乘最後一項", options: ["第 1 步 (漏乘最後一項)", "第 2 步", "正負號錯誤", "完全正確"], correct: 0, explanation: "外面的 $-3$ 必須乘以括號內每一項，最後一項 $-7$ 漏乘了。" },
            { id: 4, topic: "帶分數未化假分數", question: "$2\\frac{1}{3} \\times 1\\frac{1}{4}$", wrong_process: "1. 整數乘整數：$2 \\times 1 = 2$\n2. 分數乘分數：$\\frac{1}{12}$\n3. 組合：$2\\frac{1}{12}$", wrong_step: "帶分數未化假分數", options: ["第 1 步", "第 1、2 步 (未化假分數)", "第 3 步", "完全正確"], correct: 1, explanation: "帶分數相乘必須先化為假分數再計算，不能整數與分數分開相乘。" },
            { id: 5, topic: "異分母加法分母相加", question: "$1 \\div \\left(\\frac{1}{2} + \\frac{1}{3}\\right)$", wrong_process: "1. 括號內相加：$\\frac{1+1}{2+3} = \frac{2}{5}$\n2. 除法：$\\frac{5}{2}$", wrong_step: "分母直接相加", options: ["第 1 步 (分母直接相加)", "第 2 步", "運算順序錯誤", "完全正確"], correct: 0, explanation: "分數相加減必須先通分才能相加，分母絕對不能直接相加。" },
            { id: 6, topic: "分子含有加法時錯誤約分", question: "$\\frac{3 + 6}{3}$", wrong_process: "1. 約分：分子分母的 3 互相約掉 $\\rightarrow \\frac{1 + 6}{1} = 7$", wrong_step: "單獨約分加法項", options: ["第 1 步 (不能單獨約分加法項)", "加法錯誤", "完全正確"], correct: 0, explanation: "分子的 $3 + 6$ 是一個整體，應先算分子 $(9)$ 再除以分母 $(3)$ 得 $3$。" },
            { id: 7, topic: "通分後分子未同步擴分", question: "$\\frac{3}{4} - \\frac{1}{6}$", wrong_process: "1. 分母變 12，分子照抄：$\\frac{3}{12} - \\frac{1}{12}$", wrong_step: "分子未同步擴分", options: ["公因數找錯", "分子未同步擴分", "完全正確"], correct: 1, explanation: "分母乘幾，分子也要同步擴分，分母變 12 時分子應分別變為 9 與 2。" },
            { id: 8, topic: "混合運算顛倒先後順序", question: "$2 - \\frac{3}{4} \\div \\frac{9}{8}$", wrong_process: "1. 先算減法 $2 - \\frac{3}{4} = \\frac{5}{4}$", wrong_step: "先做了減法", options: ["應先算除法", "倒數錯誤", "完全正確"], correct: 0, explanation: "乘除法優先於加減法，應先算後方的除法。" },
            { id: 9, topic: "除法對乘法做錯誤分配", question: "$5 \\div \\left(\\frac{1}{2} \\times \\frac{1}{3}\\right)$", wrong_process: "1. 錯誤分配：$5 \\div \\frac{1}{2} + 5 \\div \\frac{1}{3}$", wrong_step: "除法對乘法做錯誤分配", options: ["錯誤分配乘法括號", "計算錯誤", "完全正確"], correct: 0, explanation: "括號內是乘法時不能分配除法，應先算括號內相乘。" },
            { id: 10, topic: "負數奇數次方觀念錯誤", question: "$(-2)^3 - 5$", wrong_process: "1. $(-2)^3 = 8$", wrong_step: "負數奇數次方正負號錯誤", options: ["負數奇數次方正負號錯誤", "減法錯誤", "完全正確"], correct: 0, explanation: "$(-2)$ 的三次方應為 $-8$，故結果為 $-8 - 5 = -13$。" },
            { id: 11, topic: "正負數加減法符號迷思", question: "$-5 - (-8)$", wrong_process: "$-5 - 8 = -13$", wrong_step: "去括號變號錯誤", options: ["減負數等於加正數", "減法變號錯誤", "完全正確"], correct: 0, explanation: "減去負數等於加上正數，$-5 + 8 = 3$。" },
            { id: 12, topic: "常數項分配律負號漏乘", question: "$-3 \\times (4 - 5)$", wrong_process: "$-3 \\times 4 - 5 = -17$", wrong_step: "第二項變號與漏乘錯誤", options: ["漏掉負負得正與乘法", "係數相乘錯誤", "完全正確"], correct: 0, explanation: "$-3 \\times (-5) = +15$，正確為 $-12 + 15 = 3$。" },
            { id: 13, topic: "分數除法未將除數倒數", question: "$\\frac{2}{3} \\div \\frac{4}{5}$", wrong_process: "$\\frac{2}{3} \\times \\frac{4}{5} = \\frac{8}{15}$", wrong_step: "未將除數倒數", options: ["未將除數倒數", "分子相乘錯誤", "完全正確"], correct: 0, explanation: "除以一個數等於乘以其倒數，應為 $\\frac{2}{3} \\times \\frac{5}{4} = \\frac{5}{6}$。" },
            { id: 14, topic: "分數平方範圍錯誤", question: "$(-\\frac{2}{3})^2$", wrong_process: "$-\\frac{4}{9}$", wrong_step: "負號未一同平方", options: ["負號未一同平方", "分子平方錯誤", "完全正確"], correct: 0, explanation: "負號受括號平方影響，結果應為正的 $\\frac{4}{9}$。" },
            { id: 15, topic: "括號外負號與運算順序錯誤", question: "$10 - 2^3$", wrong_process: "$(10 - 2)^3 = 8^3 = 512$", wrong_step: "擅自加括號改變運算順序", options: ["擅自加括號改變次方順序", "指數計算錯誤", "完全正確"], correct: 0, explanation: "應先算次方 $2^3 = 8$，再做減法 $10 - 8 = 2$。" },
            { id: 16, topic: "分數加減通分倍數錯誤", question: "$\\frac{1}{3} + \\frac{1}{4}$", wrong_process: "$\\frac{4}{7} + \\frac{3}{7}$", wrong_step: "分母相加而非找公倍數", options: ["分母相加錯誤", "通分倍數錯誤", "完全正確"], correct: 0, explanation: "應找最小公倍數 12 通分，而不是分母直接相加。" },
            { id: 17, topic: "連續除法順序錯誤", question: "$12 \\div 3 \\div 2$", wrong_process: "$12 \\div (3 \\div 2) = 8$", wrong_step: "未由左至右計算", options: ["未由左至右計算", "除法錯誤", "完全正確"], correct: 0, explanation: "連續除法應由左至右依序計算：$12 \\div 3 = 4$，$4 \\div 2 = 2$。" },
            { id: 18, topic: "整數與分數相加通分錯誤", question: "$2 + \\frac{1}{3}$", wrong_process: "$\\frac{2}{3}$", wrong_step: "整數未化為同分母", options: ["整數未化為同分母", "加法錯誤", "完全正確"], correct: 0, explanation: "2 應化為 $\\frac{6}{3}$ 再相加，結果為 $\\frac{7}{3}$。" },
            { id: 19, topic: "括號前負號去括號漏變號", question: "$10 - (2 + 3 - 4)$", wrong_process: "$10 - 2 + 3 - 4$", wrong_step: "括號內未全面變號", options: ["僅第一項變號", "計算錯誤", "完全正確"], correct: 0, explanation: "括號前是負號，展開應每項變號：$10 - 2 - 3 + 4 = 9$。" },
            { id: 20, topic: "分數乘法約分觀念錯誤", question: "$\\frac{3}{4} \\times \\frac{8}{9}$", wrong_process: "$\\frac{24}{13}$", wrong_step: "分子分母互相亂加", options: ["分子分母計算錯誤", "未正確約分", "完全正確"], correct: 0, explanation: "應為交叉約分：$\\frac{3}{4} \\times \\frac{8}{9} = \\frac{2}{3}$。" },
            { id: 21, topic: "負數加法方向錯誤", question: "$(-12) + 7$", wrong_process: "$+19$", wrong_step: "異號相加誤算成相加", options: ["異號相加應相減", "加法錯誤", "完全正確"], correct: 0, explanation: "異號相加應相減並取絕對值較大者符號，結果為 $-5$。" },
            { id: 22, topic: "指數律乘法底數相加錯誤", question: "$2^3 \\times 2^2$", wrong_process: "$2^6$", wrong_step: "指數相乘錯誤", options: ["指數相乘錯誤", "底數相乘錯誤", "完全正確"], correct: 0, explanation: "同底數相乘，指數相加得 $2^5$。" },
            { id: 23, topic: "分數約分遺漏公因數", question: "$\\frac{24}{36}$", wrong_process: "$\\frac{6}{9}$", wrong_step: "未約到最簡分數", options: ["未約到最簡分數", "公因數找錯", "完全正確"], correct: 0, explanation: "最大公因數為 12，應化簡為 $\\frac{2}{3}$（$\\frac{6}{9}$ 還可再約分）。" },
            { id: 24, topic: "乘法對加法分配律漏乘第一項", question: "$4 \\times (5 + 3)$", wrong_process: "$5 + 4 \\times 3$", wrong_step: "漏乘第一項", options: ["漏乘第一項", "計算錯誤", "完全正確"], correct: 0, explanation: "4 必須乘以括號內每一項：$4 \\times 5 + 4 \\times 3 = 32$。" },
            { id: 25, topic: "連續負號化解完全正確", question: "$-(-(-5))$", wrong_process: "-5", wrong_step: "完全正確", options: ["負號累計次數錯誤", "符號判斷錯誤", "完全正確"], correct: 2, explanation: "總共有三個負號（奇數個），負負得正後再乘一個負號，結果為 $-5$，計算完全正確！" },
            { id: 26, topic: "分數乘法整數與分母亂約", question: "$5 \\times \\frac{3}{5}$", wrong_process: "$\\frac{25}{3}$", wrong_step: "整數誤乘入分母", options: ["整數乘分母錯誤", "約分錯誤", "完全正確"], correct: 0, explanation: "整數應與分子相乘或與分母約分，結果為 3。" },
            { id: 27, topic: "中括號與小括號順序顛倒", question: "$[20 \\div (5 - 3)] \\times 2$", wrong_process: "$20 \\div [5 - (3 \\times 2)]$", wrong_step: "擅自更改運算次序", options: ["更改運算次序", "括號計算錯誤", "完全正確"], correct: 0, explanation: "應由內而外計算小括號，不能擅自改變括號層級與順序。" },
            { id: 28, topic: "分數減法借位觀念錯誤", question: "$3 - 1\\frac{1}{4}$", wrong_process: "$2\\frac{1}{4}$", wrong_step: "未借位", options: ["未借位", "減法錯誤", "完全正確"], correct: 0, explanation: "3 應借位為 $2\\frac{4}{4}$，故 $2\\frac{4}{4} - 1\\frac{1}{4} = 1\\frac{3}{4}$。" },
            { id: 29, topic: "乘除混合加括號錯誤", question: "$8 \\div 4 \\times \\frac{1}{2}$", wrong_process: "$8 \\div (4 \\times \\frac{1}{2}) = 4$", wrong_step: "擅自加括號改變順序", options: ["擅自加括號改變順序", "計算錯誤", "完全正確"], correct: 0, explanation: "乘除法同級應由左至右：$8 \\div 4 = 2$，$2 \\times \\frac{1}{2} = 1$。" },
            { id: 30, topic: "負數次方與括號位置陷阱", question: "$-3^2$ 與 $(-3)^2$", wrong_process: "皆為 9", wrong_step: "忽略負號是否受平方影響", options: ["忽略負號受平方影響", "指數錯誤", "完全正確"], correct: 0, explanation: "$-3^2 = -9$，而 $(-3)^2 = 9$，兩者不相等。" },
            // 31 至 50 題
            { id: 31, topic: "連續減負數變號錯誤", question: "$10 - (-3) - (-5)$", wrong_process: "$10 - 3 - 5 = 2$", wrong_step: "未將連續減負數轉為加法", options: ["減負數未變號", "加減法順序錯誤", "完全正確"], correct: 0, explanation: "減負數等於加正數，應為 $10 + 3 + 5 = 18$。" },
            { id: 32, topic: "分數連乘約分錯誤", question: "$\\frac{2}{3} \\times \\frac{3}{4} \\times \\frac{4}{5}$", wrong_process: "$\\frac{24}{60} = \\frac{2}{5}$", wrong_step: "未先約分導致計算繁複或出錯", options: ["未先約分", "分子相乘錯誤", "完全正確"], correct: 0, explanation: "連乘時可先上下互約，直接得到 $\\frac{2}{5}$（雖結果對但過程未先約分）。" },

            { id: 34, topic: "分數加減與整數混合通分錯誤", question: "$1 - \\frac{3}{5} + \\frac{1}{2}$", wrong_process: "$1 - \\frac{4}{7} = \\frac{3}{7}$", wrong_step: "異分母分數直接相加減", options: ["未全部通分", "分母直接相加", "完全正確"], correct: 0, explanation: "應全部化為同分母 10：$\\frac{10}{10} - \\frac{6}{10} + \\frac{5}{10} = \\frac{9}{10}$。" },
            { id: 35, topic: "零的除法觀念混淆", question: "$0 \\div (-5) + 10$", wrong_process: "$(-5) + 10 = 5$", wrong_step: "零除以數的結果計算錯誤", options: ["零除以負數計算錯誤", "加法錯誤", "完全正確"], correct: 0, explanation: "$0 \\div (-5) = 0$，故 $0 + 10 = 10$。" },

            { id: 37, topic: "分數除法與乘法混淆順序", question: "$6 \\div \\frac{2}{3} \\times \\frac{1}{4}$", wrong_process: "$6 \\div \\left(\\frac{2}{3} \\times \\frac{1}{4}\\right) = 36$", wrong_step: "擅自加括號改變由左至右順序", options: ["未由左至右計算", "倒數錯誤", "完全正確"], correct: 0, explanation: "乘除法同級應由左至右：$6 \\times \\frac{3}{2} = 9$，再乘 $\\frac{1}{4}$ 為 $\\frac{9}{4}$。" },
            { id: 38, topic: "大中小括號內層優先順序錯誤", question: "$18 - [6 + 2 \\times (3 - 5)]$", wrong_process: "1. 先算外層 $18 - 6 = 12$\n2. 繼續計算", wrong_step: "未由內而外先算最內層括號", options: ["未先算最內層括號", "乘法錯誤", "完全正確"], correct: 0, explanation: "必須先算最內層小括號 $3 - 5 = -2$，再算中括號內乘法。" },
            { id: 39, topic: "帶分數減法借位計算錯誤", question: "$5\\frac{1}{4} - 2\\frac{3}{4}$", wrong_process: "$3\\frac{2}{4} = 3\\frac{1}{2}$", wrong_step: "分子直接大減小而未向整數借位", options: ["分子直接相減未向整數借位", "減法錯誤", "完全正確"], correct: 0, explanation: "因 $\\frac{1}{4} < \\frac{3}{4}$，須向 5 借 1 變成 $4\\frac{5}{4} - 2\\frac{3}{4} = 2\\frac{2}{4} = 2\\frac{1}{2}$。" },
            { id: 40, topic: "同底數相除指數相減錯誤", question: "$2^5 \\div 2^3$", wrong_process: "$2^{5 \\div 3}$ 或 $1^2$", wrong_step: "指數相除誤算成指數相除或底數相減", options: ["指數相除觀念錯誤", "底數相減錯誤", "完全正確"], correct: 0, explanation: "同底數相除，指數相減：$2^{5-3} = 2^2 = 4$。" },
            { id: 41, topic: "負數乘方與括號省略陷阱", question: "$-2^4$", wrong_process: "$16$", wrong_step: "誤將負號包含在次方範圍內", options: ["負號未受偶數次方影響", "次方計算錯誤", "完全正確"], correct: 0, explanation: "$-2^4 = -(2 \\times 2 \\times 2 \\times 2) = -16$。" },
            { id: 42, topic: "分數與小數混合四則運算盲點", question: "$0.5 + \\frac{1}{3}$", wrong_process: "$0.5 + 0.3 = 0.8$ (分數化小數無限循環誤判)", wrong_step: "將分數化為不準確的小數計算", options: ["化為小數產生循環誤差", "通分錯誤", "完全正確"], correct: 0, explanation: "應將小數化為分數統一計算：$\\frac{1}{2} + \\frac{1}{3} = \\frac{3}{6} + \\frac{2}{6} = \\frac{5}{6}$。" },
            { id: 43, topic: "多重括號去括號變號錯誤", question: "$5 - \\{2 - [3 - (1 - 4)]\\}$", wrong_process: "1. 直接把所有括號拆開未變號", wrong_step: "未由內而外依序去括號並變號", options: ["未由內而外逐層去括號", "加減法錯誤", "完全正確"], correct: 0, explanation: "先算最內層 $(1 - 4) = -3$，再算中括號 $[3 - (-3)] = 6$，依序向外推算。" },
            { id: 44, topic: "分數乘法與約分觀念混淆", question: "$\\frac{5}{8} \\times \\frac{4}{15}$", wrong_process: "$\\frac{20}{120} = \\frac{1}{6}$ (未先交叉約分)", wrong_step: "數字過大未先交叉約分導致計算失誤", options: ["未先交叉約分", "分子分母相乘錯誤", "完全正確"], correct: 0, explanation: "交叉約分：5與15約為1和3，4與8約為1和2，得 $\\frac{1}{6}$。" },
            { id: 45, topic: "負數運算距離觀念混淆", question: "$(-8) - (-3)$", wrong_process: "$(-8) + (-3) = -11$", wrong_step: "減負數誤算為加負數", options: ["減負數應變號為加正數", "加法錯誤", "完全正確"], correct: 0, explanation: "$(-8) - (-3) = -8 + 3 = -5$。" },
            { id: 46, topic: "乘法分配律對分數加法錯誤", question: "$12 \\times \\left(\\frac{1}{3} + \\frac{1}{4}\\right)$", wrong_process: "$12 \\times \\frac{1}{3} + \\frac{1}{4} = 4 + \\frac{1}{4}$", wrong_step: "分配時漏掉第二項的乘法", options: ["第二項漏乘係數 12", "分數加法錯誤", "完全正確"], correct: 0, explanation: "12 必須乘以每一項：$12 \\times \\frac{1}{3} + 12 \\times \\frac{1}{4} = 4 + 3 = 7$。" },
            { id: 47, topic: "分數分母含有減法之化簡陷阱", question: "$\\frac{10}{5 - 3}$", wrong_process: "$\\frac{10}{5} - \\frac{10}{3} = 2 - 3\\frac{1}{3}$", wrong_step: "分母含有減法卻對分子做錯誤分配", options: ["分母為減法時不可拆開分子分母", "減法計算錯誤", "完全正確"], correct: 0, explanation: "分母為一個整體 $5 - 3 = 2$，故 $\\frac{10}{2} = 5$。" },
            { id: 48, topic: "連續正負號化簡順序錯誤", question: "$(-2) + (+3) - (-4) + (-5)$", wrong_process: "$-2 + 3 + 4 - 5 = 0$", wrong_process_correction: "$-2 + 3 + 4 - 5 = 0$ (此題計算正確，設計選項陷阱)", wrong_step: "正負號化簡概念混淆", options: ["正負號化簡錯誤", "加減計算錯誤", "完全正確"], correct: 3, explanation: "連續符號化簡：$-2 + 3 + 4 - 5 = 0，過程完全正確。" },
            { id: 49, topic: "帶分數除法未化假分數直接相除", question: "$3\\frac{1}{2} \\div 1\\frac{1}{2}$", wrong_process: "$3 \\div 1 = 3$ 且 $\\frac{1}{2} \\div \\frac{1}{2} = 1$，故 $3 \\div 1 = 3$", wrong_step: "帶分數除法將整數與分數獨立相除", options: ["帶分數除法不可拆開獨立計算", "倒數錯誤", "完全正確"], correct: 0, explanation: "必須先化為假分數：$\\frac{7}{2} \\div \\frac{3}{2} = \\frac{7}{2} \\times \\frac{2}{3} = \\frac{7}{3}$。" },
            { id: 50, topic: "零次方與負數次方觀念混淆", question: "$(-5)^0 - (-2)^{-1}$", wrong_process: "$0 - (-\\frac{1}{2}) = \\frac{1}{2}$", wrong_step: "任何非零數的零次方誤算為 0", options: ["非零數的零次方應為 1", "負指數倒數錯誤", "完全正確"], correct: 0, explanation: "$(-5)^0 = 1$，而 $(-2)^{-1} = -\\frac{1}{2}$，故 $1 - (-\\frac{1}{2}) = 1 + \\frac{1}{2} = \\frac{3}{2}$。" }
        ];

        let currentQuizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let studentAnswers = [];
        let studentInfo = { class: "", seat: "" };

        // 請在此處貼上您的 Google Apps Script 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxJkCcgLpIBU7CEVDoqcFN9l1c1gyCRZFYjcBG4jYAHzUqQmYoiIpYbc073-3u7ybe8FA/exec"; 

        window.onload = function() {
            const currentUrl = window.location.href.split('#')[0];
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl, width: 120, height: 120
            });
        };

        function startQuiz() {
            const cls = document.getElementById('input-class').value.trim();
            const seat = document.getElementById('input-seat').value.trim();
            if (!cls || !seat) { alert("請填寫班級與座號！"); return; }
            studentInfo.class = cls; studentInfo.seat = seat;

            currentQuizQuestions = [...QUESTION_BANK].sort(() => Math.random() - 0.5).slice(0, 10);
            currentQuestionIndex = 0; score = 0; studentAnswers = [];

            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            document.getElementById('quiz-student-badge').innerText = `${cls}班 ${seat}號`;
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuizQuestions[currentQuestionIndex];
            document.getElementById('quiz-progress').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${currentQuizQuestions.length} 題`;
            document.getElementById('question-text').innerHTML = q.question;
            document.getElementById('wrong-process').innerHTML = q.wrong_process;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                optsContainer.innerHTML += `
                    <button onclick="selectOption(${idx})" class="w-full text-left px-4 py-3 border-2 border-slate-800 rounded-xl hover:bg-orange-100 font-bold text-slate-800 option-btn bg-white">
                        ${String.fromCharCode(65 + idx)}. ${opt}
                    </button>
                `;
            });

            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();
        }

        function selectOption(selectedIdx) {
            const q = currentQuizQuestions[currentQuestionIndex];
            const optionBtns = document.querySelectorAll('.option-btn');
            
            optionBtns.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) btn.classList.add('bg-emerald-100', 'border-emerald-600');
                else if (idx === selectedIdx) btn.classList.add('bg-rose-100', 'border-rose-600');
            });

            const isCorrect = (selectedIdx === q.correct);
            if (isCorrect) score += 10;

            studentAnswers.push({ questionId: q.id, topic: q.topic, isCorrect: isCorrect });

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');
            if (isCorrect) {
                feedbackBox.className = "p-4 rounded-xl text-sm border-2 border-slate-800 bg-emerald-50 text-emerald-900 font-bold";
                feedbackBox.innerHTML = `<strong>✅ 答對了！</strong><br>${q.explanation}`;
            } else {
                feedbackBox.className = "p-4 rounded-xl text-sm border-2 border-slate-800 bg-rose-50 text-rose-900 font-bold";
                feedbackBox.innerHTML = `<strong>❌ 答錯囉！</strong>迷思：${q.wrong_step}<br>解析：${q.explanation}`;
            }

            document.getElementById('next-btn').classList.remove('hidden');
            if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizQuestions.length) renderQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} 分`;

            const wrongItems = studentAnswers.filter(a => !a.isCorrect);
            let summaryHtml = `<h4 class="font-black mb-2">📋 健檢報告：</h4>`;
            if (wrongItems.length === 0) summaryHtml += `<p class="text-emerald-700 font-bold">全數答對！完美通關！</p>`;
            else {
                summaryHtml += `<ul class="list-disc pl-5 text-rose-800 font-semibold">`;
                wrongItems.forEach(w => summaryHtml += `<li>題號 ${w.questionId}：${w.topic}</li>`);
                summaryHtml += `</ul>`;
            }
            document.getElementById('result-summary').innerHTML = summaryHtml;

            const payload = {
                class: studentInfo.class,
                seat: studentInfo.seat,
                score: score,
                wrongTopics: wrongItems.map(w => `題${w.questionId}:${w.topic}`).join(', ') || "全對",
                timestamp: new Date().toLocaleString()
            };

            if (GAS_URL && GAS_URL.startsWith("http")) {
                fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.log("雲端同步錯誤:", err));
            }
        }
    </script>
